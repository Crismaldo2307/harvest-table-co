  <text x="110" y="170" font-family="'Fira Code', monospace" font-size="24" fill="#334155">SELECT</text>
  <text x="110" y="206" font-family="'Fira Code', monospace" font-size="24" fill="#334155">  b.year, b.neighborhood, b.avg_rent,</text>
