  <rect x="80" y="408" width="1120" height="220" rx="24" fill="#ffffff" stroke="#d9c89a" stroke-width="3" />
  <text x="110" y="456" font-family="'Inter', sans-serif" font-size="28" fill="#1f2937">Vista enriquecida</text>
  <text x="110" y="500" font-family="'Inter', sans-serif" font-size="22" fill="#475569">2019 · Eixample · 1.038,7 € · Negocios: 6.187 · Extranjeros: 32 %</text>
